name: Update and Release

on:
  schedule:
    # Monthly at 16:20 UTC on day 1 ~= 00:20 Asia/Shanghai on day 2
    - cron: "20 16 1 * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lists
        env:
          GEOVIEW_VERSION: "0.2.6"
        run: |
          python scripts/build.py --dist dist --cache .cache --with-json

      - name: Mirror GFW list
        run: |
          python scripts/build_gfw.py --dist dist

      - name: Show metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("dist/foreign-domains-meta.json").read_text(encoding="utf-8"))
          gfw = json.loads(Path("dist/gfw-meta.json").read_text(encoding="utf-8"))
          print(json.dumps(meta, ensure_ascii=True, indent=2))
          print(json.dumps(gfw, ensure_ascii=True, indent=2))
          for name in [
              "foreign-domains.txt",
              "foreign-domains-dnsmasq.conf",
              "foreign-domains-dnsmasq-0.0.0.0.conf",
              "foreign-domains.json",
              "foreign-domains-meta.json",
              "gfw.txt",
              "gfw-meta.json",
          ]:
              p = Path("dist") / name
              print(f"{name}: {p.stat().st_size} bytes")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foreign-domains
          path: |
            dist/foreign-domains.txt
            dist/foreign-domains-dnsmasq.conf
            dist/foreign-domains-dnsmasq-0.0.0.0.conf
            dist/foreign-domains.json
            dist/foreign-domains-meta.json
            dist/gfw.txt
            dist/gfw-meta.json
          if-no-files-found: error

      - name: Prepare release notes
        id: meta
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y%m%d%H%M)"
          echo "tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          export DATE_TAG
          python - <<'PY'
          import os
          import textwrap
          import json
          from pathlib import Path

          tag = os.environ["DATE_TAG"]
          foreign = json.loads(Path("dist/foreign-domains-meta.json").read_text(encoding="utf-8"))
          gfw = json.loads(Path("dist/gfw-meta.json").read_text(encoding="utf-8"))

          foreign_count = foreign["counts"]["domains"]
          foreign_generated_at = foreign["generated_at"]
          gfw_count = gfw["count"]
          gfw_generated_at = gfw["generated_at"]
          gfw_source_url = gfw["source"]["url"]
          gfw_sha256 = gfw["source"]["sha256"]

          notes = f"""\
          ## foreign-domains {tag}

          - 规则：`ban = (geolocation-!cn | union(*@!cn)) - union(*@cn) - geosite:category-dev`
          - 域名数量：**{foreign_count}**
          - 生成时间：`{foreign_generated_at}`
          - 数据源：[v2fly/domain-list-community](https://github.com/v2fly/domain-list-community) `dlc.dat`
          - 提取工具：[snowie2000/geoview](https://github.com/snowie2000/geoview)

          ### 发布文件

          | 文件 | 说明 |
          |---|---|
          | `foreign-domains-dnsmasq.conf` | dnsmasq 配置，返回 NXDOMAIN |
          | `foreign-domains-dnsmasq-0.0.0.0.conf` | dnsmasq 配置，解析到 `0.0.0.0` |
          | `foreign-domains.txt` | 纯域名列表 |
          | `foreign-domains.json` | JSON 域名清单和元数据 |
          | `foreign-domains-meta.json` | 构建时间、数量和校验结果 |

          ### dnsmasq

          ```conf
          conf-file=/etc/dnsmasq.d/foreign-domains.conf
          ```

          ### 稳定直链

          工作流完成后，`latest` 分支会同步以下稳定文件：

          - `foreign-domains-dnsmasq.conf`
          - `foreign-domains-dnsmasq-0.0.0.0.conf`
          - `foreign-domains.txt`
          - `foreign-domains-meta.json`

          ## gfw {tag}

          - 来源：`{gfw_source_url}`
          - 域名数量：**{gfw_count}**
          - 生成时间：`{gfw_generated_at}`
          - 校验值：`{gfw_sha256}`

          ### 发布文件

          | 文件 | 说明 |
          |---|---|
          | `gfw.txt` | 上游 `gfw.txt` 的镜像 |
          | `gfw-meta.json` | 构建时间、数量和校验结果 |

          ### 稳定直链

          - `https://raw.githubusercontent.com/ZqinKing/foreign-domains/latest/gfw.txt`
          - `https://raw.githubusercontent.com/ZqinKing/foreign-domains/latest/gfw-meta.json`
          """
          Path("release-notes.md").write_text(textwrap.dedent(notes), encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: foreign-domains ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/foreign-domains.txt
            dist/foreign-domains-dnsmasq.conf
            dist/foreign-domains-dnsmasq-0.0.0.0.conf
            dist/foreign-domains.json
            dist/foreign-domains-meta.json
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable files to latest branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: latest
          force_orphan: true
          enable_jekyll: true
          commit_message: "chore: update foreign domain lists ${{ steps.meta.outputs.tag }}"
