name: Update and Release

on:
  schedule:
    # Daily 16:20 UTC ~= 00:20 Asia/Shanghai
    - cron: "20 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lists
        env:
          GEOVIEW_VERSION: "0.2.6"
        run: |
          python scripts/build.py --dist dist --cache .cache --with-json

      - name: Show metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("dist/foreign-domains-meta.json").read_text(encoding="utf-8"))
          print(json.dumps(meta, ensure_ascii=True, indent=2))
          for name in [
              "foreign-domains.txt",
              "foreign-domains-dnsmasq.conf",
              "foreign-domains-dnsmasq-0.0.0.0.conf",
              "foreign-domains.json",
              "foreign-domains-meta.json",
          ]:
              p = Path("dist") / name
              print(f"{name}: {p.stat().st_size} bytes")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foreign-domains
          path: |
            dist/foreign-domains.txt
            dist/foreign-domains-dnsmasq.conf
            dist/foreign-domains-dnsmasq-0.0.0.0.conf
            dist/foreign-domains.json
            dist/foreign-domains-meta.json
          if-no-files-found: error

      - name: Prepare release notes
        id: meta
        env:
          FORMULA: "ban = (geolocation-!cn | union(*@!cn)) - union(*@cn)"
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y%m%d%H%M)"
          COUNT="$(python -c 'import json;print(json.load(open("dist/foreign-domains-meta.json",encoding="utf-8"))["counts"]["domains"])')"
          GEN_AT="$(python -c 'import json;print(json.load(open("dist/foreign-domains-meta.json",encoding="utf-8"))["generated_at"])')"
          echo "tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "generated_at=${GEN_AT}" >> "$GITHUB_OUTPUT"
          export DATE_TAG COUNT GEN_AT
          python - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          tag = os.environ["DATE_TAG"]
          count = os.environ["COUNT"]
          generated_at = os.environ["GEN_AT"]
          formula = os.environ["FORMULA"]

          notes = f"""\
          ## foreign-domains {tag}

          - 规则：`{formula}`
          - 域名数量：**{count}**
          - 生成时间：`{generated_at}`
          - 数据源：[v2fly/domain-list-community](https://github.com/v2fly/domain-list-community) `dlc.dat`
          - 提取工具：[snowie2000/geoview](https://github.com/snowie2000/geoview)

          ### 发布文件

          | 文件 | 说明 |
          |---|---|
          | `foreign-domains-dnsmasq.conf` | dnsmasq 配置，返回 NXDOMAIN |
          | `foreign-domains-dnsmasq-0.0.0.0.conf` | dnsmasq 配置，解析到 `0.0.0.0` |
          | `foreign-domains.txt` | 纯域名列表 |
          | `foreign-domains.json` | JSON 域名清单和元数据 |
          | `foreign-domains-meta.json` | 构建时间、数量和校验结果 |

          ### dnsmasq

          ```conf
          conf-file=/etc/dnsmasq.d/foreign-domains.conf
          ```

          ### 稳定直链

          工作流完成后，`latest` 分支会同步以下稳定文件：

          - `foreign-domains-dnsmasq.conf`
          - `foreign-domains-dnsmasq-0.0.0.0.conf`
          - `foreign-domains.txt`
          - `foreign-domains-meta.json`
          """
          Path("release-notes.md").write_text(textwrap.dedent(notes), encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: foreign-domains ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/foreign-domains.txt
            dist/foreign-domains-dnsmasq.conf
            dist/foreign-domains-dnsmasq-0.0.0.0.conf
            dist/foreign-domains.json
            dist/foreign-domains-meta.json
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable files to latest branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: latest
          force_orphan: true
          enable_jekyll: true
          commit_message: "chore: update foreign domain lists ${{ steps.meta.outputs.tag }}"
